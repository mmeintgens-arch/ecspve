# Einstellungen für ecspve-helfer auf dem Proxmox-Host (/etc/ecspve/helfer.conf). Alles ist optional.

# Projektordner von StreetworkDoc auf dem Host – für dessen App-Update (git pull + create-lxc.sh --update)
STREETWORKDOC_QUELLE=/root/StreetworkDoc

# Knopf „Host aktualisieren“ und HOST_AUTO_UPDATE der Übersicht erlauben (nein = nur anzeigen)
HOST_UPDATE=ja

# Eigene Befehle je Container – überschreiben die eingebauten (Beispiele für Container 130):
#   Funktionsprüfung im Container: eine Adresse (Antwort 2xx/3xx = in Ordnung) oder ein Befehl (Rückgabe 0)
# PRUEFUNG_130=http://127.0.0.1:8123/
#   App-Update auf dem Host; {id} wird zur Container-ID
# UPDATE_130=pct exec {id} -- /usr/local/bin/mein-update
